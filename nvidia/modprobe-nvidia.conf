# NVIDIA DRM modesetting & Framebuffer (required for Hyprland/Wayland)
options nvidia_drm modeset=1 fbdev=1

# Video memory preservation for clean suspend/resume
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp

# Dynamic Power Management (RTD3 power down when idle on supported hybrid GPUs)
options nvidia NVreg_DynamicPowerManagement=0x02
