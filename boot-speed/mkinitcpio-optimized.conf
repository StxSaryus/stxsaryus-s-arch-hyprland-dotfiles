# Optimize edilmiş mkinitcpio – initramfs küçülür, açılış hızlanır
# Uygula: sudo cp mkinitcpio-optimized.conf /etc/mkinitcpio.conf && sudo mkinitcpio -P

# NVIDIA modüllerini initramfs'ten çıkar (root mount sonrası yüklenecek, initramfs ~285MB -> ~30MB)
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect modconf kms block filesystems keyboard fsck)

# Daha hızlı açılış için sıkıştırma (lz4 = hızlı decompress)
COMPRESSION="lz4"
