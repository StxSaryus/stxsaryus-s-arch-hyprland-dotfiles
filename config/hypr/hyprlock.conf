# ============================================================
#  Hyprlock — same palette, same radii as the rest of the rice
# ============================================================

source = ~/.config/theme/colors-hypr.conf

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    # Rendered once when the session locks, so the blur is affordable
    # even on the GPUs this rice keeps compositor blur off for.
    blur_passes = 3
    blur_size = 6
    noise = 0.011
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $lockShadow
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Who is logged in
label {
    monitor =
    text = 󰀄  $USER
    color = $accent
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    rounding = 16
    outer_color = $borderInactive
    inner_color = $lockField
    font_color = $text
    check_color = $accent
    fail_color = $red
    capslock_color = $yellow
    placeholder_text = <span foreground="##7d8598">Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

# Battery / keyboard layout hint line
label {
    monitor =
    text = cmd[update:5000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/$/%  battery/' || true
    color = $muted
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
