# ============================================================
# StxSaryus — hyprlock configuration
# Modern dark glass screen locker
# ============================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(242, 243, 244, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(200, 205, 215, 0.85)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(33, 204, 255, 0.8) rgba(100, 180, 255, 0.6) 45deg
    inner_color = rgba(18, 18, 24, 0.85)
    font_color = rgb(235, 235, 245)
    fade_on_empty = false
    placeholder_text = <span foreground="##8a909d">Enter password...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(0, 230, 153, 0.8)
    fail_color = rgba(255, 75, 75, 0.8)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
