# ============================================================
# --- EREN EDITION v1.0 | Arch Linux | NVIDIA 1050 Ti ---
# ============================================================

# 1. MONİTÖR (1920x1080 @ 60Hz)
monitor=,highres,auto,1

# 2. NVIDIA KRİTİK AYARLAR (v0.53+ Uyumlu)
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# Qt Wayland + Multimedia (Qt uygulamaları ve multimedya hatası için)
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

cursor {
    no_hardware_cursors = true
}

# start-hyprland uyarısını kapat (greetd start-hyprland kullanıyorsa zaten çıkmaz)
misc {
    disable_watchdog_warning = 1
}

# 3. OTOMATİK BAŞLAT (Sadece lazım olanlar)
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = bash -c '~/.config/hypr/waybar-autohide.sh &'
exec-once = dunst
exec-once = waypaper --restore

# 4. GİRİŞ & KLAVYE (İngilizce US)
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# 5. GÖRÜNÜM (Elegant & Modern)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) # Arch Mavisi
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = false
        size = 3
        passes = 1
    }
    shadow {
        enabled = false # 1050 Ti'ı yormamak için kapalı
    }
}

# 6. ANİMASYONLAR (Temiz tek blok)
animations {
    enabled = true

    # Bezier Eğrileri (Akışkanlık ayarı)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = bounce, 0.1, 1, 0.1, 1.1

    # Standart Animasyonlar
    animation = windows, 1, 5, bounce, slide
    animation = windowsIn, 1, 5, bounce, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, myBezier, slide
    animation = specialWorkspace, 1, 5, myBezier, slidevert
}

# 7. KISAYOLLAR (SUPER = Win Tuşu)
$mainMod = SUPER

bind = SHIFT, F11, fullscreen
bind = $mainMod, T, exec, kitty
bind = $mainMod, C, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, ~/.local/share/bin/launcher-toggle.sh
bind = $mainMod, L, exec, hyprlock

# --- NAVİGASYON VE MASAÜSTÜ YÖNETİMİ ---

# A. Odak Değiştirme (Ok tuşlarıyla)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# B. Sadece Sen Git (Win + Scroll)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# C. Pencereyi Kap ve Beraber Git (Win + Shift + Scroll)
# Not: Bir pencereyi taşırken Shift'e basarsan o pencereyle beraber uçarsın.
bind = $mainMod SHIFT, mouse_down, movetoworkspace, e+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, e-1

# D. Win + Sayı ile Masaüstü Değiştir
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# E. Win + Alt + Sayı ile Pencereyi Gönder (Sessizce gönderir, sen yerinde kalırsın)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5

# F. Win + Shift + Sayı ile Pencereyi Kap ve Oraya Git
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# G. Mouse ile Pencere Taşıma/Boyutlandırma (SUPER + Sol/Sağ Tık)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 8. ÇALIŞMA MODLARI
dwindle {
    pseudotile = true
    preserve_split = true
}


# --- HP Omen FN tuşları (ses + parlaklık) ---

# Parlaklık (Fn + güneş tuşları) + bildirim
bind = , XF86MonBrightnessUp,   exec, ~/.config/hypr/brightness-osd.sh up
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/brightness-osd.sh down

# Ses (Fn + hoparlör tuşları)
bind = , XF86AudioRaiseVolume,  exec, pamixer -i 5
bind = , XF86AudioLowerVolume,  exec, pamixer -d 5
bind = , XF86AudioMute,         exec, pamixer -t
bind = , XF86AudioMicMute,      exec, pamixer --default-source -t

# Medya tuşları (play / next / prev / stop)
bind = , XF86AudioPlay,   exec, playerctl play-pause
bind = , XF86AudioPause,  exec, playerctl play-pause
bind = , XF86AudioNext,   exec, playerctl next
bind = , XF86AudioPrev,   exec, playerctl previous
bind = , XF86AudioStop,   exec, playerctl stop
