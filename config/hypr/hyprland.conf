# ============================================================
#  StxSaryus — Hyprland
#  Arch Linux · Wayland · NVIDIA tuned
#  Colours live in ~/.config/theme/palette.conf
# ============================================================

source = ~/.config/theme/colors-hypr.conf

# ── Default applications ─────────────────────────────────────
# install.sh rewrites these five lines; everything below refers
# to the variables, so there is exactly one place to change.
$terminal = kitty
$browser = firefox
$fileManager = thunar
$launcher = ~/.local/share/bin/launcher-toggle.sh
$lockCmd = hyprlock

$mainMod = SUPER

# ── Monitors ─────────────────────────────────────────────────
# Highest refresh rate the display advertises, auto position, no scaling.
monitor = , highres, auto, 1

# ── Environment ──────────────────────────────────────────────
# NVIDIA (Hyprland 0.53+)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Wayland-native clients
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Qt: Wayland first, XCB as fallback, GTK dialogs for a single look
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# One dark theme and one cursor across GTK, Qt and Hyprland
env = GTK_THEME,adw-gtk3-dark
env = GTK_ICON_THEME_NAME,Papirus-Dark
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

cursor {
    # Software cursors avoid the NVIDIA hardware-cursor flicker
    no_hardware_cursors = true
}

misc {
    disable_watchdog_warning = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Stop redrawing at full rate when nothing moves — the single biggest
    # idle power win on a laptop
    vfr = true
    vrr = 1
    focus_on_activate = true
}

# ── Autostart ────────────────────────────────────────────────
exec-once = ~/.config/hypr/apply-dark-theme.sh
exec-once = ~/.config/hypr/wallpaper-sync.sh
exec-once = hyprpaper
exec-once = systemctl --user start xdg-desktop-portal xdg-desktop-portal-hyprland xdg-desktop-portal-gtk
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = ~/.config/hypr/waybar-autohide.sh
exec-once = swaync
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator

# ── Input ────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap_to_click = true
    }
}

gestures {
    # 0.51 replaced workspace_swipe with the 1:1 gesture system:
    # https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/
    gesture = 3, horizontal, workspace
}

# ── Appearance ───────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $borderActive
    col.inactive_border = $borderInactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        # Off by design: on a 1050 Ti class GPU the blur pass costs more
        # frame time than the look is worth. Flip enabled to true if your
        # card can spare it.
        enabled = false
        size = 4
        passes = 2
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = false
        range = 16
        render_power = 2
        color = $lockShadow
    }
}

# ── Animations ───────────────────────────────────────────────
animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    bezier = snap, 0.2, 1, 0.3, 1
    bezier = bounce, 0.1, 1, 0.1, 1.1

    animation = windowsIn, 1, 4, bounce, popin 92%
    animation = windowsOut, 1, 4, snap, popin 88%
    animation = windowsMove, 1, 4, smooth
    animation = border, 1, 8, snap
    animation = borderangle, 0
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
    animation = specialWorkspace, 1, 4, smooth, slidevert
    animation = layers, 1, 3, snap, fade
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

# ============================================================
#  Key bindings
# ============================================================

# ── Applications ─────────────────────────────────────────────
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, L, exec, $lockCmd
bind = $mainMod, W, exec, waypaper
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, P, exec, ~/.config/waybar/scripts/lock-toggle.sh
bind = $mainMod, X, exec, cliphist list | rofi -dmenu -config ~/.config/rofi/config.rasi -p "Clipboard" | cliphist decode | wl-copy

# ── Windows ──────────────────────────────────────────────────
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, exec, hyprctl activewindow -j | jq -r '.pid' | xargs -r kill -9
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = SHIFT, F11, fullscreen, 0
bind = $mainMod, J, togglesplit,
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window within the layout
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Workspaces ───────────────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod SHIFT, mouse_down, movetoworkspace, e+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, e-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Send window there and follow
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Send window there and stay put
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# ── Screenshots ──────────────────────────────────────────────
bind = , Print, exec, grim - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# ── Hardware keys ────────────────────────────────────────────
# All of them route through one OSD so the popups look identical.
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/osd.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/osd.sh brightness down
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/osd.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/osd.sh volume down
bindl = , XF86AudioMute, exec, ~/.config/hypr/osd.sh volume mute
bindl = , XF86AudioMicMute, exec, ~/.config/hypr/osd.sh mic mute

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# ============================================================
#  Window rules
# ============================================================

# Utility windows float, centred, at a comfortable size
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(nwg-look)$
windowrule = float, class:^(waypaper)$
windowrule = float, class:^(custom_btop)$
windowrule = float, title:^(Open File|Save File|Choose Files|Open Folder)$
windowrule = size 900 600, class:^(pavucontrol)$
windowrule = size 900 600, class:^(blueman-manager)$
windowrule = size 1000 700, class:^(waypaper)$
windowrule = size 1100 700, class:^(custom_btop)$
windowrule = center, class:^(pavucontrol|blueman-manager|nm-connection-editor|nwg-look|waypaper|custom_btop)$

# Picture-in-picture stays on top wherever it goes
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = size 640 360, title:^(Picture-in-Picture)$

# Electron / Chromium ask to be maximised on launch — politely decline
windowrule = suppressevent maximize, class:.*

# Fix odd cursor offsets on XWayland windows without a real size
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
