[Settings]
language = en
folder = ~/Wallpapers
monitors = All
wallpaper = ~/Wallpapers/default.png
show_path_in_tooltip = True
backend = hyprpaper
fill = fill
sort = daterev
color = #0d0f14
subfolders = True
all_subfolders = True
show_hidden = True
