[Settings]
language = en
folder = ~/Wallpapers
monitors = All
wallpaper = ~/Wallpapers/default.png
show_path_in_tooltip = True
backend = hyprpaper
fill = fill
sort = daterev
color = #0d0f14
subfolders = True
all_subfolders = True
show_hidden = True
show_gifs_only = False
zen_mode = False
post_command = ~/.config/hypr/wallpaper-sync.sh
number_of_columns = 3
swww_transition_type = grow
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
# stylesheet and keybindings are deliberately absent: Waypaper defaults both
# to ~/.config/waypaper/, which is where install.sh puts style.css. Setting
# "stylesheet" explicitly breaks the theme, because it is the one path option
# Waypaper does not expand ~ for, and the failure is swallowed silently.
