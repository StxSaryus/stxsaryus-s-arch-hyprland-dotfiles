# --- EREN EDITION v1.0 | KITTY CONFIG ---

# 1. FONT (Jilet gibi keskin)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# 2. GÖRÜNÜM (Cam Efekti & Şeffaflık)
background_opacity         0.85
dynamic_background_opacity yes
confirm_os_window_close    0
window_padding_width       10

# 3. İMLEÇ (Cursor)
cursor_shape               beam
cursor_trail               1
cursor_trail_decay         0.1 0.4

# 4. RENK ŞEMASI (Deep Dark)
foreground       #dddddd
background       #0a0a0a
selection_foreground none
selection_background none

# 5. PERFORMANS & SİSTEM
linux_display_server wayland
enable_audio_bell    no
scrollback_lines     5000
mouse_hide_wait      3.0

# 6. KLAVYE KISAYOLLARI
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- OKUNABİLİRLİK FIX (Siyah Yazılar İçin) ---
# Normal Siyah (color0) - Eskiden #111111 falandı, şimdi koyu gri
color0  #45475a
# Parlak Siyah / Gri (color8) - Daha belirgin bir gri
color8  #585b70

# Diğer temel renkleri de biraz parlatıp netleştirelim (Opsiyonel ama iyi olur)
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

