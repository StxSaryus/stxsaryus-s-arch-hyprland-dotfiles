# ============================================================
#  NOCTURNE — the one and only palette of this rice
# ============================================================
#
#  Every colour used anywhere in this repo comes from this file.
#  Edit here, then run:
#
#      ./config/theme/build-theme.sh
#
#  ...and Hyprland, Waybar, Rofi, Kitty, SwayNC, nwg-bar, Hyprlock,
#  Waypaper and GTK all follow along.
#
#  Format: NAME=RRGGBB (no leading '#', lowercase hex).
#  This file is sourced by bash, so keep it to plain assignments.
# ============================================================

# --- Surfaces (deep, blue-tinted dark) ----------------------
crust=07080b        # deepest — lock screen, terminal shadow
base=0d0f14         # base window / terminal background
mantle=11131a       # bar + panel glass
surface=1a1d26      # cards, grouped modules, input fields
overlay=262a36      # hover / pressed surfaces
line=3a4152         # hairline separators & inactive borders

# --- Text ---------------------------------------------------
text=e6e9f0         # primary text
subtext=b6bdcd      # secondary text
muted=7d8598        # tertiary text, comments, placeholders
faint=4d5566        # disabled / decorative

# --- Accents ------------------------------------------------
accent=33ccff       # primary — Arch cyan, the identity colour
accent_deep=1aa3d1  # pressed / dimmed accent
blue=89b4fa
mauve=cba6f7
green=a6e3a1
teal=94e2d5
yellow=f9e2af
peach=fab387
red=f38ba8
pink=f5c2e7

# --- Alpha channel of the glass surfaces (0.00 - 1.00) ------
alpha_bar=0.78      # auto-hide bar
alpha_popup=0.94    # rofi / notification centre / power menu
alpha_card=0.80      # grouped modules inside the bar
alpha_hover=0.85    # hover highlight
alpha_term=0.85     # kitty background

# --- Geometry (documented here, applied by hand per format) -
# radius_sm = 8px    pills, buttons, list rows
# radius_md = 12px   windows, notification cards
# radius_lg = 16px   bar, launcher, control centre, lock box
# gap_in    = 6px    inner window gap
# gap_out   = 12px   outer window gap
# border    = 2px    window border width

# --- Typography ---------------------------------------------
# font_ui   = JetBrainsMono Nerd Font
# size_sm   = 12px   window title, secondary labels
# size_md   = 13px   default bar / launcher text
# size_lg   = 15px   glyph-only buttons
